<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section id="dos-donts" aria-labelledby="dd-title" style="padding:2.5rem 0;border-top:1px solid var(--line)">
  <h2 id="dd-title" style="font-size:1.75rem;margin-bottom:.4rem">Do’s &amp; don’ts</h2>
  <p style="margin:0 0 1.25rem;color:var(--muted)">The habits that make the biggest difference.</p>
  <div class="ae-2col" style="gap:1.25rem">
    <div style="display:flex;flex-direction:column;gap:.6rem">
      <h3 style="font-family:var(--font-body);font-size:1rem;font-weight:700;display:flex;align-items:center;gap:.5rem;color:var(--ok)"><span aria-hidden="true" style="width:1.75rem;height:1.75rem;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:.8rem"><i class="fa-solid fa-check"></i></span>Do</h3>
      <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem">
        <sc-for list="{{ dos }}" as="d" hint-placeholder-count="4">
          <li style="display:flex;gap:.75rem;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--ok);border-radius:.875rem;padding:.9rem 1rem;box-shadow:var(--shadow)"><i class="fa-solid fa-circle-check" aria-hidden="true" style="color:var(--ok);margin-top:.25rem"></i><span><span class="sr-only">Do: </span>{{ d }}</span></li>
        </sc-for>
      </ul>
    </div>
    <div style="display:flex;flex-direction:column;gap:.6rem">
      <h3 style="font-family:var(--font-body);font-size:1rem;font-weight:700;display:flex;align-items:center;gap:.5rem;color:var(--bad)"><span aria-hidden="true" style="width:1.75rem;height:1.75rem;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;font-size:.8rem"><i class="fa-solid fa-xmark"></i></span>Don’t</h3>
      <ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem">
        <sc-for list="{{ donts }}" as="d" hint-placeholder-count="4">
          <li style="display:flex;gap:.75rem;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--bad);border-radius:.875rem;padding:.9rem 1rem;box-shadow:var(--shadow)"><i class="fa-solid fa-circle-xmark" aria-hidden="true" style="color:var(--bad);margin-top:.25rem"></i><span><span class="sr-only">Don’t: </span>{{ d }}</span></li>
        </sc-for>
      </ul>
    </div>
  </div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;lesson&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:6,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  componentDidMount(){ this._u=()=>this.forceUpdate(); window.addEventListener('ae:ready',this._u); }
  componentWillUnmount(){ window.removeEventListener('ae:ready',this._u); }
  renderVals(){ const AE=window.AE; const d=AE?AE.dosdonts[Number(this.props.lesson||1)]:null; return d?{dos:d.dos,donts:d.donts}:{}; }
}
</script>
</body>
</html>
