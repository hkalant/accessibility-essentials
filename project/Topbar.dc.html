<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div class="ae-sticky-desk" style="z-index:60">
<a href="#main" data-chrome="skip" style="position:fixed;left:1rem;top:-8rem;z-index:300;background:var(--ink);color:var(--surface);padding:.75rem 1.1rem;border-radius:.6rem;font-weight:700;text-decoration:none" style-focus="top:1rem">Skip to main content</a>
<header data-chrome="topbar" class="ae-sticky-desk" style="z-index:60;background:var(--surface);border-bottom:1px solid var(--line)">
  <div style="height:4rem;padding:0 1.25rem;display:flex;align-items:center;gap:1rem">
    <a href="Home.dc.html" style="display:flex;align-items:center;gap:.65rem;text-decoration:none;color:var(--ink);min-width:0">
      <span aria-hidden="true" style="flex:none;width:2.25rem;height:2.25rem;border-radius:.65rem;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.15rem"><i class="fa-solid fa-universal-access"></i></span>
      <span style="font-family:var(--font-head);font-weight:700;font-size:1.125rem;line-height:1.1">Accessibility Essentials</span>
    </a>
    <div style="flex:1"></div>
    <nav aria-label="Main" class="ae-desk" style="display:flex;gap:.25rem">
      <sc-for list="{{ nav }}" as="it" hint-placeholder-count="3">
        <a href="{{ it.href }}" aria-current="{{ it.current }}" style="display:flex;align-items:center;gap:.5rem;padding:.55rem .85rem;border-radius:.6rem;text-decoration:none;font-weight:600;font-size:.9375rem;color:{{ it.color }};background:{{ it.bg }}" style-hover="background:var(--accent-soft);color:var(--accent-text)"><i class="fa-solid {{ it.icon }}" aria-hidden="true"></i>{{ it.label }}</a>
      </sc-for>
    </nav>
    <button type="button" class="ae-desk" onClick="{{ openPanel }}" aria-expanded="{{ panelOpen }}" aria-controls="ae-panel" style="flex:none;display:flex;align-items:center;gap:.5rem;min-height:2.75rem;padding:.5rem .9rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:.9375rem;cursor:pointer" style-hover="background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-text)">
      <i class="fa-solid fa-sliders" aria-hidden="true" style="color:var(--accent)"></i><span>Display</span>
    </button>
  </div>
</header>
<dc-import name="A11yPanel" hint-size="0,0"></dc-import>
<dc-import name="FloatingBar" active="{{ active }}" hint-size="0,0"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;course&quot;,&quot;glossary&quot;,&quot;badge&quot;],&quot;default&quot;:&quot;course&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { panelOpen: false };
  componentDidMount(){ this._p=e=>this.setState({panelOpen:!!(e.detail&&e.detail.open)}); window.addEventListener('ae:panel-state',this._p); }
  componentWillUnmount(){ window.removeEventListener('ae:panel-state',this._p); }
  renderVals(){
    const active=this.props.active||'course';
    const nav=[['course','Home.dc.html','Course','fa-house'],['glossary','Glossary.dc.html','Glossary','fa-book'],['badge','Badge.dc.html','Progress','fa-chart-simple']].map(([id,href,label,icon])=>{
      const on=id===active; return {href,label,icon,current:on?'page':undefined,color:on?'var(--accent-text)':'var(--ink)',bg:on?'var(--accent-soft)':'transparent'};
    });
    return { nav, active, panelOpen: this.state.panelOpen?'true':'false', openPanel:()=>window.dispatchEvent(new CustomEvent('ae:panel',{detail:{toggle:true}})) };
  }
}
</script>
</body>
</html>
